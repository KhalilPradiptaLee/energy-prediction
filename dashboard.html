<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles/dashboard.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column justify-content-between">
    <div>
      <div class="logo">
        <img src="./assets/logo.png" alt="Logo" class="img-fluid" style="max-height: 60px;">
        <p style="font-size: 13px;">PT. MITRA ABADI MAHAKAM</p>
      </div>
      <nav class="nav flex-column">
        <a class="nav-link active bg-white text-dark rounded-pill mx-3 mt-1" href="dashboard.html"><i
            class="bi bi-book me-2"></i>Dashboard</a>
            <a class="nav-link" href="prediksi.html"><i class="bi bi-graph-up-arrow me-2"></i>Prediksi</a>
            <a class="nav-link" href="input_data.html"><i class="bi bi-database-add me-2"></i>Input Data</a>
        <a class="nav-link" href="user_guide.html"><i class="bi bi-speedometer2 me-2"></i>User Guide</a>
      </nav>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Logout button -->
    <div class="logout">
      <button class="btn btn-danger rounded-pill px-4"><i class="bi bi-power"></i> Logout</button>
    </div>

    <!-- Dashboard Content -->
    <div class="container mt-4">
      <h1>Dashboard</h1>
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Penggunaan Solar dalam Seminggu</h5>
          <div class="row">
            <div class="col">
              <div style="background-color: #FF5722; height: 200px;"></div>
              <p>Grafik Penggunaan Solar (Placeholder)</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-md-4">
          <div class="card">
            <div class="card-body text-center">
              <h5>Total Pemakaian</h5>
              <p>1.320 Liter</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body text-center">
              <h5>Rata-Rata Harian</h5>
              <p>220 Liter</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h5>Catatan</h5>
              <p>Penggunaan minggu ini lebih banyak 15% dibanding minggu kemarin!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
